name: Market Data EOD Pipeline

on:
  schedule:
    # Se ejecuta de lunes a viernes a las 21:00 UTC (al cierre de mercado en NY)
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # Permite ejecutar el flujo manualmente desde el botón en GitHub

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute ETL Pipeline
        run: python etl_pipeline.py

      - name: Upload Gold Parquet Artifact
        uses: actions/upload-artifact@v3
        with:
          name: gold-market-analytics
          path: gold_market_analytics.parquet